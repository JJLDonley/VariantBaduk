<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Variant Go Server</title>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/themes.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/forms.css" />
    <link rel="stylesheet" href="/styles/buttons.css" />
    <link rel="stylesheet" href="/styles/game-list.css" />
    <link rel="stylesheet" href="/styles/create-game.css" />
    <link rel="stylesheet" href="/styles/custom-goban.css" />
    <link rel="stylesheet" href="/styles/joseki-card.css" />
    <link rel="stylesheet" href="/styles/panels.css" />
    <link rel="stylesheet" href="/styles/players.css" />
    <link rel="stylesheet" href="/styles/dialogs.css" />
    <link rel="stylesheet" href="/styles/board.css" />
    <link rel="stylesheet" href="/styles/responsive.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <h1><a class="home-link" href="/">Variant Go</a></h1>
        <div class="header-actions">
          <button
            id="app-remake"
            class="app-back app-remake"
            data-tooltip="Forking game settings"
            type="button"
            aria-label="Fork game settings"
            hidden
          >
            <svg
              class="header-action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="8" y="8" width="12" height="12" rx="2"></rect>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
            </svg>
          </button>
          <button id="app-help" class="app-help" type="button" aria-label="Show help">
            <svg
              class="header-action-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.07 14H3v-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-1.56V3h4v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9c.26.62.86 1.02 1.54 1.02H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"
              ></path>
            </svg>
          </button>
          <button
            id="coordinate-toggle"
            class="coordinate-toggle"
            type="button"
            aria-label="Coordinates"
            aria-pressed="false"
          >
            A1
          </button>
          <button
            id="stone-shadow-toggle"
            class="stone-shadow-toggle"
            type="button"
            aria-label="Stone shadows"
            aria-pressed="true"
            title="Stone shadows"
          >
            <span class="stone-shadow-toggle__stone" aria-hidden="true"></span>
          </button>
          <div id="sound-control" class="sound-control">
            <button
              id="sound-toggle"
              class="sound-toggle"
              type="button"
              aria-label="Sound volume"
              aria-expanded="false"
            >
              🔊
            </button>
            <div id="sound-popover" class="sound-popover" hidden>
              <label>
                Stone volume
                <input
                  id="stone-volume"
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  aria-label="Stone volume"
                />
              </label>
              <label>
                Voice volume
                <input
                  id="voice-volume"
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  aria-label="Voice volume"
                />
              </label>
              <label>
                Countdown
                <select id="countdown-sound" aria-label="Countdown sound">
                  <option value="english">English</option>
                  <option value="chinese">Chinese</option>
                  <option value="beep">Beep</option>
                  <option value="off">Off</option>
                </select>
              </label>
            </div>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Change theme">
            ◐
          </button>
        </div>
      </header>

      <dialog class="ui-dialog landing-help-dialog">
        <button class="dialog-close" data-landing-help-close type="button" aria-label="Close">
          ×
        </button>
        <div data-landing-help-body></div>
      </dialog>

      <aside class="card ui-card game-list-card" aria-labelledby="game-list-title">
        <form id="name-form" class="name-form">
          <label>
            Name
            <input name="name" maxlength="16" autocomplete="nickname" />
          </label>
        </form>
        <details class="games-disclosure">
          <summary id="game-list-title">Games</summary>
          <div id="game-list" class="game-list">Loading…</div>
        </details>
      </aside>

      <section class="card ui-panel panel-card ui-scroll" aria-labelledby="create-game-title">
        <div class="create-game-header">
          <h2 id="create-game-title">Game Settings</h2>
          <button type="submit" form="create-game-form">Create</button>
        </div>
        <form id="create-game-form" class="create-game-form">
          <div class="core-settings stack ui-stack">
            <input name="creatorSeat" type="hidden" value="black" />
            <button class="seat-toggle" type="button" data-seat-toggle>Seat: Black</button>

            <label>
              Game name
              <input name="gameName" maxlength="32" autocomplete="off" />
            </label>

            <div class="board-size-setting">
              <span>Board size</span>
              <input name="boardSize" type="hidden" value="19" />
              <input name="customGobanMode" type="checkbox" hidden />
              <div class="board-size-options" data-board-size-group>
                <button class="board-size-button" data-board-size-option="9" type="button">
                  9
                </button>
                <button class="board-size-button" data-board-size-option="13" type="button">
                  13
                </button>
                <button
                  class="board-size-button is-active"
                  data-board-size-option="19"
                  type="button"
                >
                  19
                </button>
                <button class="board-size-button" data-board-size-option="cgoban" type="button">
                  Custom
                </button>
              </div>
            </div>

            <div class="score-settings compact-settings-row">
              <label>
                Scoring
                <select name="ruleset">
                  <option value="chinese">Chinese</option>
                  <option value="aga">AGA</option>
                  <option value="japanese">Japanese</option>
                </select>
              </label>
              <label>
                Komi
                <input name="komi" type="number" step="0.5" value="7.5" />
              </label>
              <label>
                Handicap
                <select name="handicap">
                  <option value="0">None</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                </select>
              </label>
            </div>

            <div class="time-settings-compact">
              <label>
                Time
                <select name="timeSystem">
                  <option value="none">None</option>
                  <option value="byoyomi">Byo-yomi</option>
                  <option value="fischer">Fischer</option>
                </select>
              </label>
              <div class="time-options compact-settings-row">
                <label data-time-option="byoyomi fischer">
                  Main Time
                  <input name="mainTime" type="number" min="0" value="0" />
                </label>
                <label data-time-option="byoyomi">
                  Period Time
                  <input name="periodTime" type="number" min="0" value="0" />
                </label>
                <label data-time-option="byoyomi">
                  Number of Period
                  <input name="periods" type="number" min="0" value="0" />
                </label>
                <label data-time-option="fischer">
                  Increment
                  <input name="fischerIncrement" type="number" min="0" value="0" />
                </label>
              </div>
            </div>
          </div>

          <div class="form-divider" aria-hidden="true"></div>

          <div class="variant-settings ui-stack">
            <h3>Variants</h3>
            <div class="variant-buttons">
              <label class="variant-button"><input type="checkbox" name="pixel" /> Pixel</label>
              <label class="variant-button"><input type="checkbox" name="zen" /> Zen</label>
              <label class="variant-button"><input type="checkbox" name="colorGo" /> Color</label>
              <label class="variant-button"><input type="checkbox" name="phantomMove" />
                Phantom</label>
              <label class="variant-button"><input type="checkbox" name="hiddenMove" />
                Hidden</label>
              <label class="variant-button"><input type="checkbox" name="josekiCard" /> Joseki
                Card</label>
              <label class="variant-button"><input type="checkbox" name="tetris" /> Tetris</label>
              <label class="variant-button"><input type="checkbox" name="nPlusOne" /> N+1</label>
              <label class="variant-button"><input type="checkbox" name="traitor" /> Traitor</label>
              <label class="variant-button"><input type="checkbox" name="randomTurn" /> Random
                Turn</label>
              <label class="variant-button"><input type="checkbox" name="teamGo" /> Team Go</label>
            </div>
            <div class="form-divider" data-variant-options-divider aria-hidden="true"></div>
            <div class="variant-options">
              <div class="game-option-settings bonus-points-settings" aria-label="Bonus points">
                <span class="bonus-points-label">Bonus Points:</span>
                <div class="bonus-points-row">
                  <label class="check">
                    Captures <input type="checkbox" name="capturesGivePoints" />
                  </label>
                  <label class="ponnuki-points-field">
                    Ponnuki
                    <input name="ponnukiPointValue" type="number" min="0" value="0" />
                  </label>
                </div>
              </div>
              <div data-variant-option="customGobanMode" class="custom-board-settings">
                <h4>Custom Board</h4>
                <input name="customGoban" type="hidden" />
                <div class="custom-board-row">
                  <button class="custom-goban-open" type="button">Edit</button>
                  <label class="variant-button"><input type="checkbox" name="circloidGobanMode" />
                    Circloid</label>
                </div>
              </div>
              <div class="team-setup-options" data-team-setup-options hidden>
                <label class="color-go-count team-count-inline" data-color-go-control><span
                  >Team</span><select
                    name="colorGoPlayerCount"
                  >
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                  </select></label>
                <div class="team-setup-matrix" aria-label="Team setup">
                  <table>
                    <thead>
                      <tr>
                        <th></th>
                        <th>Black</th>
                        <th>White</th>
                        <th data-color-go-player="3">Green</th>
                        <th data-color-go-player="4">Red</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <th scope="row">Color</th>
                        <td>
                          <label aria-label="Black color"><input
                              name="colorGoColor1"
                              type="color"
                              value="#111111"
                            /></label>
                        </td>
                        <td>
                          <label aria-label="White color"><input
                              name="colorGoColor2"
                              type="color"
                              value="#eeeeee"
                            /></label>
                        </td>
                        <td data-color-go-player="3">
                          <label aria-label="Green color"><input
                              name="colorGoColor3"
                              type="color"
                              value="#4f9d69"
                            /></label>
                        </td>
                        <td data-color-go-player="4">
                          <label aria-label="Red color"><input
                              name="colorGoColor4"
                              type="color"
                              value="#e07a5f"
                            /></label>
                        </td>
                      </tr>
                      <tr data-team-go-seat-label>
                        <th scope="row">Seats</th>
                        <td>
                          <input
                            name="teamGoSeats1"
                            data-team-go-seat
                            type="number"
                            min="0"
                            max="9"
                            value="2"
                          />
                        </td>
                        <td>
                          <input
                            name="teamGoSeats2"
                            data-team-go-seat
                            type="number"
                            min="0"
                            max="9"
                            value="2"
                          />
                        </td>
                        <td data-color-go-player="3">
                          <input
                            name="teamGoSeats3"
                            data-team-go-seat
                            type="number"
                            min="0"
                            max="9"
                            value="0"
                          />
                        </td>
                        <td data-color-go-player="4">
                          <input
                            name="teamGoSeats4"
                            data-team-go-seat
                            type="number"
                            min="0"
                            max="9"
                            value="0"
                          />
                        </td>
                      </tr>
                      <tr data-color-go-control>
                        <th scope="row">Komi</th>
                        <td class="team-setup-empty">—</td>
                        <td><input name="colorGoKomi2" type="number" step="0.5" value="5.5" /></td>
                        <td data-color-go-player="3">
                          <input
                            name="colorGoKomi3"
                            type="number"
                            step="0.5"
                            value="7.5"
                          />
                        </td>
                        <td data-color-go-player="4">
                          <input
                            name="colorGoKomi4"
                            type="number"
                            step="0.5"
                            value="7.5"
                          />
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
              <div class="variant-count-group" data-variant-count-group hidden>
                <span class="variant-count-title">Counts / Chance</span>
                <div class="variant-count-row">
                  <label class="compact-variant-setting" data-variant-option="nPlusOne">
                    N+1
                    <input name="nPlusOneCount" type="number" min="1" value="1" />
                  </label>
                  <label class="compact-variant-setting" data-variant-option="hiddenMove">
                    Hidden
                    <input name="hiddenMoveCount" type="number" min="1" max="20" value="3" />
                  </label>
                  <div class="compact-variant-setting" data-variant-option="traitor">
                    <span>Traitor</span>
                    <div class="traitor-setting-controls">
                      <select name="traitorMode" aria-label="Traitor setting">
                        <option value="moves">Moves</option>
                        <option value="percentage">Chance %</option>
                      </select>
                      <input
                        name="traitorMoveCount"
                        type="number"
                        min="1"
                        value="6"
                        aria-label="Traitor move count"
                        data-traitor-mode-value="moves"
                      />
                      <input
                        name="traitorChancePercent"
                        type="number"
                        min="1"
                        max="100"
                        value="10"
                        aria-label="Traitor chance percentage"
                        data-traitor-mode-value="percentage"
                        hidden
                        disabled
                      />
                    </div>
                  </div>
                </div>
              </div>
              <label data-variant-option="zen">
                Zen players
                <input name="zenPlayerCount" type="number" min="3" max="9" step="2" value="3" />
              </label>
              <label class="check" data-invisible-stones-control hidden>
                <input type="checkbox" name="invisibleStonesShowViewers" checked /> Viewers see
                invisible stones
              </label>
              <div data-variant-option="josekiCard" class="ui-stack">
                <button class="joseki-card-open" type="button">Preview Joseki Cards</button>
                <p class="ui-muted">
                  Joseki Card requires 19×19. Selection and placement happen before normal play.
                </p>
              </div>
            </div>
          </div>
        </form>
      </section>

      <p id="status" class="sr-only" aria-live="polite">Checking server…</p>
    </main>
  </body>
</html>
